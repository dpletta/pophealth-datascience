project:
  type: book
  output-dir: _book
  execute-dir: project
  resources:
    - data/raw/*.csv
    - data/README.md
    - data/lookup/*.csv

book:
  title: "Data Science for Population Health Sciences"
  subtitle: "Practical walkthroughs in R"
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/data-preparation.qmd
    - part: "Survey-weighted analysis with BRFSS 2024"
      chapters:
        - chapters/survey/01-import.qmd
        - chapters/survey/02-engineering.qmd
        - chapters/survey/03-cleaning.qmd
        - chapters/survey/04-descriptives.qmd
        - chapters/survey/05-imputation.qmd
        - chapters/survey/06-bivariate.qmd
        - chapters/survey/07-multivariable.qmd
  appendices:
    - chapters/survey/decisions.qmd
    - chapters/survey/reproducibility.qmd
  search: true

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: show
    code-summary: "Show / hide code"
    code-copy: true
    code-overflow: wrap
    number-sections: true
    fig-responsive: true

callout-appearance: simple
callout-icon: false

execute:
  echo: true
  warning: true
  message: true
  error: false
  freeze: false
