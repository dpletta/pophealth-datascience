<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 735" role="img" aria-labelledby="title desc">
<title id="title">Stacking compared with joining</title>
<desc id="desc">Panel A stacks a main-file table and a version-1 table with the same three columns into one four-row table with a source column. Panel B left-joins a three-row respondent table to a two-row state lookup by STATE, keeping three rows and adding a region column. A note warns that joining versions of the same survey on a made-up key duplicates shared columns.</desc>
<rect width="960" height="735" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#11666b"/></marker></defs>
<text x="28" y="40" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#193549" font-weight="bold" text-anchor="start">Stacking adds rows; joining adds columns</text>
<text x="28" y="82" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#11666b" font-weight="bold" text-anchor="start">A. Stack versions of the same survey with bind_rows()</text>
