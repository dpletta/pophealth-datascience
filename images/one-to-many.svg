<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 343" role="img" aria-labelledby="title desc">
<title id="title">One participant, two matching visits</title><desc id="desc">Participant 001 matches visits V01 and V02. The left join repeats participant 001 twice, changing the unit from one person to participant-visit rows.</desc>
<rect width="960" height="343" fill="#ffffff"/>
