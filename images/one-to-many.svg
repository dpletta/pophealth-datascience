<text x="28" y="39" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#193549" font-weight="bold" text-anchor="start">One-to-many: a left join can increase the row count</text>
<text x="28" y="78" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#11666b" font-weight="bold" text-anchor="start">One participant</text>
