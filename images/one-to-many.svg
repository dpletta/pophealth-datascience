<text x="46" y="265" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#193549" font-weight="bold" text-anchor="start">If you need one row per person, summarize visits by participant_id first.</text>
<text x="46" y="292" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#253746" font-weight="normal" text-anchor="start">Then join that one-row-per-person summary back to the roster.</text>
