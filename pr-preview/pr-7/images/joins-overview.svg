<title id="title">Six joins, shown as rows</title><desc id="desc">The left roster has IDs 001, 002, 003 and clinics A, B, A. The right survey has IDs 002, 003, 004 and scores 7, missing, 5. Left joins retain 001,002,003; inner 002,003; right 002,003,004; full all four; semi 002,003 with roster columns; anti 001 with roster columns.</desc>
