<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
<title id="title">From raw files to a prepared dataset</title><desc id="desc">Preserve raw files, inspect rows and keys, clean documented values, query and join, validate the unit and counts, and save derived data separately.</desc>
<rect width="960" height="320" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#11666b"/></marker></defs>
<text x="30" y="38" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#193549" font-weight="bold" text-anchor="start">A small, reproducible data-preparation workflow</text>
<rect x="30" y="68" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="46" y="98" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">1  Preserve</text>
<text x="46" y="127" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Keep raw CSVs unchanged.</text>
<rect x="350" y="68" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="366" y="98" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">2  Inspect</text>
<text x="366" y="127" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Identify rows, keys, types.</text>
<rect x="670" y="68" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="686" y="98" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">3  Clean</text>
<text x="686" y="127" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Apply documented rules.</text>
<rect x="30" y="204" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="46" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">4  Connect</text>
<text x="46" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Query, summarize, join.</text>
<rect x="350" y="204" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="366" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">5  Validate</text>
<text x="366" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Check rows and matches.</text>
<rect x="670" y="204" width="260" height="85" rx="10" fill="#edf6f5" stroke="#b5cbd1"/>
<text x="686" y="234" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#11666b" font-weight="bold" text-anchor="start">6  Save</text>
<text x="686" y="263" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#253746" font-weight="normal" text-anchor="start">Write new derived files.</text>
<path d="M302 110 L336 110" stroke="#11666b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M622 110 L656 110" stroke="#11666b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M800 163 L800 179 L160 179 L160 194" fill="none" stroke="#11666b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M302 247 L336 247" stroke="#11666b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M622 247 L656 247" stroke="#11666b" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
